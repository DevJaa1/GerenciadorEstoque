<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockSys - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/loginstyle.css">
</head>

<body>

    <div class="container">
        <div class="brand-header">
            <div class="brand-icon">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <h2>StockSys</h2>
            <p class="brand-subtitle">Gerenciamento de Estoque</p>
        </div>

        <h1>Entrar na conta</h1>
        <p class="auth-desc">Digite suas credenciais para acessar o painel</p>

        <form id="formLogin">
            <div class="input-group">
                <label for="email">E-mail</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="seu.email@exemplo.com" 
                        required
                    >
                </div>
            </div>

            <div class="input-group">
                <label for="senha">Senha</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="senha" 
                        placeholder="Digite sua senha" 
                        required
                    >
                </div>
            </div>

            <button type="submit">Entrar na plataforma</button>
        </form>
        
        <p class="login-text">
            <a href="cadastroUsuario.html" class="forgot-link">Esqueceu a senha?</a>
        </p>
        <p class="login-text signup-prompt">
            Ainda não tem conta? <a href="cadastroUsuario.html">Criar conta gratuita</a>
        </p>
    </div>

    <script src="../js/login.js"></script>

</body>

</html>
