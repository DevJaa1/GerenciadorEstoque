<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Cadastro - Gerenciador de Estoque</title>
    <link rel="stylesheet" href="css/stylecadastro.css">
</head>

<body>

    <div class="container">

        <h1>Criar conta</h1>

        <form id="formCadastro">

            <input 
                type="text" 
                id="nome"
                placeholder="Nome de usuário"
                required
            >

            <input 
                type="password" 
                id="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Cadastrar
            </button>

        </form>


        <p>
            Já possui conta?
            <a href="login.html">
                Fazer login
            </a>
        </p>

    </div>


<script src="js/cadastro.js"></script>

</body>

</html>
