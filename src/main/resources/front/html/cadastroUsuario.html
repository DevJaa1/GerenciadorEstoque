<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocker Manager - Cadastro</title>
    <link rel="stylesheet" href="../css/stylecadastro.css">
</head>

<body>

    <div class="container">
        <h1>Criar conta</h1>

        <form id="formCadastro">
            <div class="input-group">
                <label for="nome">Nome Completo</label>
                <input 
                    type="text" 
                    id="nome" 
                    placeholder="Digite seu nome" 
                    required
                    minlength="3"
                    maxlength="100"
                >
            </div>

            <div class="input-group">
                <label for="usuario">Nome de Usuário</label>
                <input 
                    type="text" 
                    id="usuario" 
                    placeholder="Ex: joaosilva" 
                    required
                >
            </div>

            <div class="input-group">
                <label for="login">Login de Acesso</label>
                <input 
                    type="text" 
                    id="login" 
                    placeholder="Ex: joao.login" 
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">E-mail</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Informe seu e-mail" 
                    required
                >
            </div>

            <div class="input-group">
                <label for="senha">Crie sua senha</label>
                <input 
                    type="password" 
                    id="senha" 
                    placeholder="Digite sua senha (mínimo 8 caracteres)" 
                    required
                    minlength="8"
                >
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <p class="login-text">
            Já possui conta? <a href="login.html">Fazer login</a>
        </p>
    </div>

    <!-- Caminho corrigido com ../js/ -->
    <script src="../js/cadastro.js"></script>

</body>

</html>
